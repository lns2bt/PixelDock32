<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b14"><title>PixelDock · Playlist</title><link rel="stylesheet" href="/static/retro.css"><script defer src="/static/brightness.js"></script><script defer src="/static/shell.js"></script><script defer src="/static/arcade.js"></script></head>
<body data-screen="playlist"><main class="retro-main">
  <div class="page-heading"><div><p class="kicker">Playlist</p><h1>What your display shows</h1><p class="muted">Drag by the handle or use the arrows. Switch items on or off, and open “Edit” for details. Clocks are scheduled on the <a href="/time-stage">Clock</a> page.</p></div><a class="button" href="/studio">+ GIF / Sprite</a></div>
  <section class="panel add-card"><form id="addModule" class="inline-form"><label class="grow">Add a module<select name="kind"><option value="weather">Weather & indoor climate</option><option value="btc">Bitcoin</option><option value="textbox">Text / scrolling text</option><option value="animations">Animation</option><option value="bitmap">Bitmap</option></select></label><label class="grow">Name<input name="name" maxlength="100" placeholder="My new module" required></label><button class="primary" type="submit">+ Add</button></form></section>
  <div class="playlist-help"><span>↕ Fixed order</span><span>✦ Shuffle: one extra after every 3 regular items</span><span>◷ Priority: shown at the next boundary</span></div>
  <div id="moduleList" class="module-list" aria-label="Playlist"><p class="muted">Loading modules…</p></div>
</main></body></html>
