<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelDock32 • Login</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/retro.css" />
</head>
<body data-page="login" data-requires-auth="false">
  <header class="top-nav">
    <div class="top-nav-inner">
      <a class="pixel-brand" href="/">PIXEL<span>DOCK</span> /32</a>
    </div>
  </header>

  <main class="app-shell auth-shell">
    <section class="card auth-card" data-section-title="Login">
      <p class="kicker">WELCOME BACK, PLAYER ONE</p>
      <h2>Dein Pixel-Universum wartet.</h2>
      <p class="subtle">Bitte melde dich an, um die PixelDock32-Steuerung zu öffnen.</p>
      <form id="loginForm" class="form-row three" onsubmit="login(event)">
        <div class="field"><label for="username">Benutzername</label><input id="username" autocomplete="username" placeholder="z. B. admin" value="admin" /></div>
        <div class="field"><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" /></div>
        <div class="field actions-end"><button id="loginButton" class="btn primary" type="submit">Einloggen</button></div>
      </form>
      <p id="loginStatus" class="subtle"></p>
    </section>
  </main>

  <div id="toast"></div>
  <script src="/static/app.js?v=20260328-map2"></script>
</body>
</html>
